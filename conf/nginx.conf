#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

location __PATH__/api/ {
    # Keep the public URI intact during YunoHost's SSO check.  Rewriting it
    # here makes SSO redirect /arcenal-draw/api/... to /api/... and Safari
    # rejects the resulting cross-origin fetch.  The trailing URI on
    # proxy_pass removes the application prefix only when proxying upstream.
    proxy_pass http://127.0.0.1:__PORT__/api/;
    proxy_set_header Host $host;
    proxy_set_header Remote-User $remote_user;
    proxy_set_header Auth-User $remote_user;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100m;
    proxy_read_timeout 300s;
}

location __PATH__/ {
    alias __INSTALL_DIR__/web/;
    index index.html;
    # Revalidate the frontend after upgrades so index.html and app.js always
    # belong to the same application version.
    add_header Cache-Control "no-cache, must-revalidate" always;
}
