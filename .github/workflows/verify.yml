name: Vérifier le paquet ARCenal DRAW

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Vérifier le code et les scripts
        run: |
          python -m py_compile backend/*.py
          python -m unittest discover -s tests -v
          bash -n scripts/*
      - name: Compiler le moteur DWG embarqué
        run: |
          curl --fail --location --silent --show-error \
            https://ftp.gnu.org/gnu/libredwg/libredwg-0.13.3.tar.xz \
            --output /tmp/libredwg.tar.xz
          echo "83f1f6e78a744777a481ff4520e4cef3f8ac4b2c1c25671077ca12fe81e8816e  /tmp/libredwg.tar.xz" | sha256sum --check
          mkdir /tmp/libredwg-source
          tar --extract --xz --file /tmp/libredwg.tar.xz --directory /tmp/libredwg-source --strip-components=1
          cd /tmp/libredwg-source
          ./configure --prefix=/tmp/libredwg-install --disable-bindings --disable-python --disable-json --enable-debug --disable-dependency-tracking --disable-werror CFLAGS="-O2 -w"
          make --silent -C src -j2
          make --silent -C programs -j2 dwg2dxf
          make --silent -C src install
          install -d /tmp/libredwg-install/bin
          install -m 755 programs/.libs/dwg2dxf /tmp/libredwg-install/bin/dwg2dxf
          /tmp/libredwg-install/bin/dwg2dxf --version
      - name: Exécuter le linter YunoHost
        # ARCenal DRAW est publié dans le catalogue privé ARCenal. Le linter
        # officiel retourne donc une erreur attendue « absente du catalogue
        # YunoHost », même lorsque le paquet lui-même est valide.
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/YunoHost/package_linter.git /tmp/package_linter
          python -m pip install -r /tmp/package_linter/requirements.txt
          python /tmp/package_linter/package_linter.py .
