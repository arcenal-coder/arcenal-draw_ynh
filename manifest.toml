packaging_format = 2

id = "arcenal_draw"
name = "ARCenal DRAW"
description.fr = "Création et archivage de plans de contrôle gammagraphique"
description.en = "Create and archive gamma radiography control plans"
version = "0.4.2~ynh1"
maintainers = ["ARCenal"]

[upstream]
license = "proprietary"

[integration]
yunohost = ">= 11.2"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = false
sso = true
    disk = "1G"
ram.build = "500M"
    ram.runtime = "300M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/arcenal-draw"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources]
        [resources.sources.libredwg]
        url = "https://ftp.gnu.org/gnu/libredwg/libredwg-0.13.3.tar.xz"
        sha256 = "83f1f6e78a744777a481ff4520e4cef3f8ac4b2c1c25671077ca12fe81e8816e"
        in_subdir = true

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    dir = "/var/lib/__APP__"

    [resources.permissions]
        [resources.permissions.main]
        url = "/"
        auth_header = true

    [resources.ports]
        [resources.ports.main]
        default = 8095

    [resources.apt]
    packages = "python3, gunicorn, poppler-utils, python3-ezdxf, librsvg2-bin, build-essential, pkg-config"
